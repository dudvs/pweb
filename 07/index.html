<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes e Cores</title>
    <style type="text/css">

        .fonteSerif{
            font-family: "Times New Roman", Times, serif;
            font-size: 80px;
            font-style: normal;
        }

        .fonteSans-Serif{
            font-family: Verdana, Arial, Helvetica, sans-serif;
            font-size: 40px;
            font-style: italic;
        }

        .fonteMonospace{
            font-family: "Courier New", Courier, monospace;
            font-size: 20px;
            font-style: oblique;
        }
    </style>
</head>
<body>

    <p class="fonteSerif">Programação Web</p>
    <p class="fonteSans-Serif">Programação Web</p>
    <p class="fonteMonospace">Programação Web</p>
    
</body>
</html>
