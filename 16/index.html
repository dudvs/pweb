<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 16</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        nav{
            text-align:center;
            margin-top:50px;
        }

        nav a{
            text-decoration:none;
            color:black;
            margin:15px;
        }

        nav ul{
            padding:40px;
        }

        nav li{
            display:inline-block;
            margin:15px;
        }

        @media (max-width:600px){

            nav{
                text-align:left;
            }

            nav a{
                display:block;
                margin:10px;
            }

            nav li{
                display: list-item;
                margin: 8px 0;
            }
        }

    </style>

</head>
<body>

    <nav>
        <ul>
            <li><a href="#">Menu 01</a></li>
            <li><a href="#">Menu 02</a></li>
            <li><a href="#">Menu 03</a></li>
            <li><a href="#">Menu 04</a></li>
            <li><a href="#">Menu 05</a></li>
        </ul>
    </nav>
    
</body>
</html>
