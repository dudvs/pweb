<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamento</title>
    <style type ="text/css">

        body {
            background: #61bd8c;
        }

        #conteudo{
            background: #FFFFFF;
            padding: 10px;
            width: 80%;
            max-width: 900px;
            margin: 30px auto;
        }

        .caixa{
            background: red;
            margin: 10px;
            width: 100px                                                                                 ;
            height: 100px;
            max-width: 15vw;
            max-height: 15vw;
            color: #FFFFFF
        }

        #relativo{
            position: relative;
            left: 30px;
        }

        #absoluto{
            position: absolute;
            left: 3%;
        }

        #fixo{
            position: fixed;
            left: 15%;
            top: 60px;
        }

    </style>
</head>
<body>

    <a href="index.html">Posicionamento</a> |
    <a href="fixarheader.html">Fixar Header</a> |
    <a href="fixarsidebar.html">Fixar Side Bar</a>

    <span>Container body</span>

    <div id="conteudo">
        Container div

        <div id="relativo" class="caixa">
            Relativo
        </div>

        <div id="absoluto" class="caixa">
            Absoluto
        </div>

        <div id="fixo" class="caixa">
            Fixo
        </div>
           
    </div>
    
</body>
</html>
