    <title>Posicionamento</title>
    <style type ="text/css">

        body {
            background: #61bd8c;
        }

        #conteudo{
            background: #FFFFFF;
            width: 450px;
            height: 150px;
            padding: 10px;

            position: absolute;
            top: 40px;
            right: 0;
        }
        
        .caixa{
            background: red;
            width: 100px;
            height: 100px;
            color: white;
        }

        #relativo{
            position: relative;
            left: 30px;
            top: 20px;
        }

        #absoluto{
            position: absolute;
            left: 30px;
            top: 140px;
        }

        #fixo{
            position: fixed;
            left: 140px;
            top: 15px;
        }

    </style>
</head>
