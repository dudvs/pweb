<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixar Header</title>

    <style>

        body{
            margin: 0;
        }

        #header{
        background: #6c7ae0;
        height: 100px;
        text-align: center;
        line-height: 100px;
        color: white;
        position: fixed;
        top: 0;
        width: 100%;
        }

        #menu{
        background: #f5b7b1;
        height: 40px;
        text-align: center;
        line-height: 40px;
        margin-top: 100px;
        }

        #menu a{
        text-decoration: none;
        color: black;
        margin: 10px;
        }

        #left{
        background: #f9e79f;
        width: 25%;
        height: 200px;
        float: left;
        margin-top: 10px;
        }

        #center{
        background: #82e0aa;
        width: 50%;
        height: 200px;
        float: left;
        margin-top: 10px;
        }

        #right{
        background: #f5cba7;
        width: 25%;
        height: 200px;
        float: left;
        margin-top: 10px;
        }

        #footer{
            background: #d7bde2;
            height: 50px;
            clear: both;
            text-align: center;
            line-height: 50px;
        }
    </style>
</head>
<body>

    <div id="header">
        HEADER
    </div>

    <div id="menu">
        <a href="index.html">Início</a> |
        <a href="fixarheader.html">Fixar Header</a> |
        <a href="fixarsidebar.html">Fixar Side Bar</a>
    </div>

    <div id="left">
        LEFT
    </div>

    <div id="center">
        CENTER
    </div>

    <div id="right">
        RIGHT
    </div>

    <div id="footer">
        FOOTER
    </div>

    
</body>
</html>
