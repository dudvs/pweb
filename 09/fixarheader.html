<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixar Header</title>

    <style>

        body{
            margin: 0;
        }

        #header{
            background: #6c7ae0;
            height: 100px;
            text-align: center;
            line-height: 100px;
            color: white;
            position: fixed;
            top: 0;
            width: 100%;
        }

        #left{
            background: #f9e79f;
            width: 25%;
            height: 300px;
            float: left;
        }

        #center{
            background: #82e0aa;
            width: 50%;
            height: 300px;
            float: left;
        }

        #right{
            background: #f5cba7;
            width: 25%;
            height: 300px;
            float: left;
        }

        #footer{
            background: #d7bde2;
            height: 50px;
            clear: both;
            text-align: center;
            line-height: 50px;
        }
    </style>
</head>
<body>

    <div id="header">
        HEADER
    </div>

    <div id="menu">
        <a href="index.html">Início</a> |
        <a href="fixarheader.html">Fixar Header</a> |
        <a href="fixarsidebar.html">Fixar Side Bar</a>
    </div>

    <div id="left">
        LEFT
    </div>

    <div id="center">
        CENTER
    </div>

    <div id="right">
        RIGHT
    </div>

    <div id="footer">
        FOOTER
    </div>

    
</body>
</html>
