<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixar Side Bar</title>

    <style>

    body{
        margin: 0;
    }

    #menu{
        background: #d97a7a;
        height: 40px;
        text-align: center;
        line-height: 40px;
        border: 1px solid black;
    }

    #menu a{
        text-decoration: none;
        color: black;
        margin: 10px;
    }

    #header{
        background: #4c5bbf;
        color: white;
        text-align: center;
        line-height: 80px;
        height: 80px;
        border: 1px solid black;
    }

    #content{
        background: #74c365;
        width: 75%;
        height: 500px;
        float: left;
        text-align: center;
        line-height: 300px;
        border: 1px solid black;
        box-sizing: border-box;
    }

    #sidebar{
        background: #8bc27c;
        width: 25%;
        height: 500px;
        float: left;
        text-align: center;
        line-height: 300px;
        border: 1px solid black;
        box-sizing: border-box;
    }

    #footer{
        background: #c7923b;
        color: white;
        height: 50px;
        clear: both;
        text-align: center;
        line-height: 50px;
        border: 1px solid black;
    }

    </style>
</head>
<body>

    <div id="menu">
        <a href="index.html">Posicionamento</a> |
        <a href="fixarheader.html">Fixar Header</a> |
        <a href="fixarsidebar.html">Fixar Side Bar</a>
    </div>

    <div id="header">
        HEADER
    </div>

    <div id="content">
        CONTENT
    </div>

    <div id="sidebar">
        SIDE BAR
    </div>

    <div id="footer">
        FOOTER
    </div>
    
</body>
</html>
