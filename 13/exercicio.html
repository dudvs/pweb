<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 13</title>
    <link rel="stylesheet" href="normalize.css">

    <style>

        .sem-box,
        .com-box{
            width:220px;
            padding:20px;
            border:15px solid;
            background:#ddd;
            text-align:center;
        }

        .sem-box{
            border-color:red;
        }

        .com-box{
            border-color:blue;

            -webkit-box-sizing:border-box;
            -moz-box-sizing:border-box;
            box-sizing:border-box;
        }

        .container-box{
            display:flex;
            justify-content:center;
            gap:40px;
            margin:30px 0;
        }

    </style>
</head>
<body>

    <p><a href="index.html"> ← Voltar</a></p>

    <h2>Demonstração da propriedade Box-sizing</h2>

    <p>O <strong>box-sizing</strong> altera a forma como o navegador calcula a largura e a altura de um elemento.</p>

    <div class="container-box">

        <div class="sem-box">
            Sem box-sizing
        </div>

        <div class="com-box">
            Com box-sizing
        </div>

    </div>

    <hr>

    <h2>Exercício Border-radius</h2>

    <div class="formas">

        <div class="flor"></div>

        <div class="circulo"></div>

    </div>
    
</body>
</html>
