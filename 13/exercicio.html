<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 13</title>
    <link rel="stylesheet" href="normalize.css">

    <style>

        .sem-box{
            width:100px;
            padding:20px;
            border:15px solid red;
            background:#ddd;
            float:left;
            margin:20px;
        }

        .com-box{
            width:100px;
            padding:20px;
            border:15px solid blue;
            background:#ddd;
            float:left;
            margin:20px;

            -webkit-box-sizing:border-box;
            -moz-box-sizing:border-box;
            box-sizing:border-box;
        }

    </style>
</head>
<body>

    <p><a href="index.html">← Voltar</a></p>

    <h1>Criação das formas utilizando border-radius</h1>

    <div class="sem-box">
        Sem box-sizing
    </div>

    <div class="com-box">
        Com box-sizing
    </div>
    
</body>
</html>
