<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 12</title>

    <script type="text/javascript">

        function mostravalor(componente){
            var nome = componente.textContent;
            alert(nome);
        }

    </script>

    <style>

        .pessoa{
            color: red;
        }

        .pessoa[data-idade='30']{
            color: blue;
        }

        .pessoa::before{
            content: 'Antes';
        }

        .pessoa::after{
            content: 'Depois';
        }
    </style>
</head>
<body>

    <ul>
        <li class="pessoa" onclick="mostravalor(this)" data-idade="20"> João </li>
        <li class="pessoa" onclick="mostravalor(this)" data-idade="30"> José </li>
        <li class="pessoa" onclick="mostravalor(this)" data-idade="40"> Maria </li>
    </ul>
    
</body>
</html>
